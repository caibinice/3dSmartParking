    # smart-parking-static-app
    location = /smartCockpit/api/parking/vision {
        client_max_body_size 2m;
        limit_req zone=platform_api burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080/api/parking/vision;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /smartCockpit/api/parking/ag-ui {
        limit_req zone=platform_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/api/parking/ag-ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /smartCockpit/api/parking-agent/stream {
        limit_req zone=platform_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/api/parking-agent/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /smartParking { return 301 /smartParking/; }
    location = /smartParking/index.html {
        root /opt/3d-smart-parking/www;
        expires -1;
        gzip_static on;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    }
    location ^~ /smartParking/ {
        root /opt/3d-smart-parking/www;
        try_files $uri $uri/ /smartParking/index.html;
        gzip_static on;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        location ~ ^/smartParking/(?:main|chunk|styles)-[A-Z0-9]+\.(js|css)$ {
            root /opt/3d-smart-parking/www;
            try_files $uri =404;
            gzip_static on;
            expires 1y;
        }
        location ~ ^/smartParking/models/.*\.glb$ {
            root /opt/3d-smart-parking/www;
            try_files $uri =404;
            gzip_static on;
            expires 1h;
        }
        location ~ ^/smartParking/vendor/ktx2/[^/]+/.*\.(js|wasm|json|md)$ {
            root /opt/3d-smart-parking/www;
            try_files $uri =404;
            gzip_static on;
            types {
                application/javascript js;
                application/wasm wasm;
                application/json json;
                text/plain md;
            }
            expires 1y;
        }
    }
    # end-smart-parking-static-app
